<!doctype html>
<html lang="es" translate="no">
<script>
	(function () {
		const mode = localStorage.getItem("mode-watcher-mode") ?? "system";
		const light = mode === "light" || (mode === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
		document.documentElement.classList.toggle("dark", !light);
	})();
</script>

<head>
	<meta charset="utf-8" />
	<meta name="google" content="notranslate" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- Sora + Manrope: las usa la navbar compartida (.sxnav), presente en todas las vistas,
	     y la landing (.coi). El cuerpo de la app no las aplica. -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
